<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03110B"/>
      <stop offset="100%" stop-color="#07281B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="260" rx="18" fill="url(#bg)" stroke="#19FF9D" stroke-opacity="0.35"/>

  <text x="24" y="26" fill="#32FF9C" font-size="14" font-family="Arial" font-weight="700">AI PROJECT NETWORK</text>

  <g stroke="#16FFA0" stroke-width="2" opacity="0.5">
    <line x1="150" y1="130" x2="400" y2="70"/>
    <line x1="150" y1="130" x2="400" y2="190"/>
    <line x1="400" y1="70" x2="650" y2="130"/>
    <line x1="400" y1="190" x2="650" y2="130"/>
  </g>

  <g>
    <circle cx="150" cy="130" r="38" fill="#06261A" stroke="#32FF9C" stroke-width="2" filter="url(#glow)"/>
    <text x="150" y="124" text-anchor="middle" fill="#9CFDD0" font-size="11" font-family="Arial">YOLO11</text>
    <text x="150" y="140" text-anchor="middle" fill="#32FF9C" font-size="9" font-family="Arial">VISION CORE</text>
  </g>

  <g>
    <circle cx="400" cy="70" r="34" fill="#06261A" stroke="#32FF9C" stroke-width="2" filter="url(#glow)"/>
    <text x="400" y="68" text-anchor="middle" fill="#9CFDD0" font-size="10" font-family="Arial">TRAFFIC</text>
    <text x="400" y="82" text-anchor="middle" fill="#32FF9C" font-size="9" font-family="Arial">ANALYTICS</text>
  </g>

  <g>
    <circle cx="400" cy="190" r="34" fill="#06261A" stroke="#32FF9C" stroke-width="2" filter="url(#glow)"/>
    <text x="400" y="188" text-anchor="middle" fill="#9CFDD0" font-size="10" font-family="Arial">RUNWAY</text>
    <text x="400" y="202" text-anchor="middle" fill="#32FF9C" font-size="9" font-family="Arial">CRACK AI</text>
  </g>

  <g>
    <circle cx="650" cy="130" r="38" fill="#06261A" stroke="#32FF9C" stroke-width="2" filter="url(#glow)"/>
    <text x="650" y="124" text-anchor="middle" fill="#9CFDD0" font-size="11" font-family="Arial">ROS2</text>
    <text x="650" y="140" text-anchor="middle" fill="#32FF9C" font-size="9" font-family="Arial">AUTONOMY</text>
  </g>

  <circle r="4" fill="#6CFFCC" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M150 130 L400 70 L650 130 L400 190 Z"/>
  </circle>

  <g fill="#8EFBD0" font-size="9" font-family="Arial" opacity="0.8">
    <text x="240" y="92">DETECTION</text>
    <text x="245" y="175">SEGMENTATION</text>
    <text x="520" y="92">NAVIGATION</text>
    <text x="520" y="178">TRACKING</text>
  </g>
</svg>