<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020B07"/>
      <stop offset="100%" stop-color="#041A12"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="220" rx="14" fill="url(#bg)" stroke="#22FF9D" stroke-opacity=".35"/>

  <circle cx="18" cy="18" r="5" fill="#FF5F57"/>
  <circle cx="34" cy="18" r="5" fill="#FEBC2E"/>
  <circle cx="50" cy="18" r="5" fill="#28C840"/>

  <text x="70" y="22" fill="#8EFBD0" font-family="Courier New" font-size="11">
    orbital_terminal.sh
  </text>

  <g font-family="Courier New" font-size="12" fill="#59FFBC">
    <text x="22" y="48">$ initialize --orbital</text>

    <text x="22" y="68">[OK] AI Core ............... ONLINE</text>

    <text x="22" y="88">[OK] YOLO11 Engine ......... READY</text>

    <text x="22" y="108">[OK] ROS2 Navigation ....... ACTIVE</text>

    <text x="22" y="128">[OK] Multi Object Tracker .. RUNNING</text>

    <text x="22" y="148">[OK] UAV Telemetry ......... LINKED</text>

    <text x="22" y="176">$ mission_status</text>

    <text x="22" y="196" filter="url(#glow)">MISSION SUCCESS • ALL SYSTEMS OPERATIONAL</text>

    <rect x="290" y="186" width="9" height="14" fill="#59FFBC">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>