<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02130d"/>
      <stop offset="100%" stop-color="#041f16"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <g stroke="#19ff8f" stroke-opacity="0.08">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200"/>
    <path d="M200 0V300M400 0V300M600 0V300M800 0V300M1000 0V300"/>
  </g>

  <g id="stars">
    <g fill="#DFFFF3">
      <circle cx="80" cy="35" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="95" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="50" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="85" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="28" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="70" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="38" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="58" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="160" r="1.1"><animate attributeName="opacity" values="1;0.4;1" dur="5.8s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="180" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="210" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="180" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="145" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="6.2s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="200" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g transform="translate(40 36)">
    <text x="0" y="0" fill="#27FF8A" font-family="Arial" font-size="18">ORBITAL RECON COMMAND</text>

    <text x="0" y="56" fill="#ECFFF5" font-family="Arial" font-size="50" font-weight="700">HIMANSHU SHARMA</text>

    <text x="0" y="88" fill="#9FE3BF" font-family="Arial" font-size="21">UAV AI • COMPUTER VISION • AUTONOMOUS SYSTEMS</text>

    <text x="0" y="132" fill="#27FF8A" font-family="Arial" font-size="13">LIVE TELEMETRY</text>

    <g transform="translate(0 150)" fill="#35FF95">
      <rect x="0" width="14" y="34" height="16" rx="2"><animate attributeName="height" values="16;36;16" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="34;14;34" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="22" width="14" y="28" height="22" rx="2"><animate attributeName="height" values="22;44;22" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="28;6;28" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="44" width="14" y="20" height="30" rx="2"><animate attributeName="height" values="30;52;30" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="20;-2;20" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="66" width="14" y="10" height="40" rx="2"><animate attributeName="height" values="40;60;40" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="10;-10;10" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="88" width="14" y="24" height="26" rx="2"><animate attributeName="height" values="26;48;26" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="24;2;24" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="110" width="14" y="2" height="48" rx="2"><animate attributeName="height" values="48;70;48" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="2;-20;2" dur="2.2s" repeatCount="indefinite"/></rect>
      <rect x="132" width="14" y="16" height="34" rx="2"><animate attributeName="height" values="34;56;34" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="16;-6;16" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="154" width="14" y="0" height="50" rx="2"><animate attributeName="height" values="50;72;50" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="0;-22;0" dur="2.4s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(850 35)">
    <circle cx="140" cy="110" r="82" fill="none" stroke="#18FF8C" stroke-width="2" stroke-dasharray="6 6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 140 110" to="360 140 110" dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="140" cy="110" r="54" fill="none" stroke="#18FF8C" stroke-opacity="0.45"/>
    <circle cx="140" cy="110" r="26" fill="none" stroke="#18FF8C" stroke-opacity="0.25"/>
    <circle cx="140" cy="110" r="5" fill="#E6FFF5" filter="url(#glow)"/>

    <line x1="140" y1="110" x2="210" y2="110" stroke="#35FF95" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 140 110" to="360 140 110" dur="3s" repeatCount="indefinite"/>
    </line>

    <circle cx="192" cy="72" r="4" fill="#35FF95" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <text x="20" y="205" fill="#27FF8A" font-family="Arial" font-size="13">FPS 62</text>
    <text x="20" y="225" fill="#27FF8A" font-family="Arial" font-size="13">LAT 28.46° N</text>
  </g>

  <g stroke="#35FF95" stroke-opacity="0.35" fill="none">
    <path d="M760 60 C820 20, 900 20, 980 60" stroke-dasharray="5 5"/>
  </g>

  <g transform="translate(760 58)">
    <circle cx="0" cy="0" r="3" fill="#35FF95" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C60 -40,140 -40,220 0"/>
    </circle>
  </g>
</svg>