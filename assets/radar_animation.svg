<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02130c"/>
      <stop offset="100%" stop-color="#041f14"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="220" rx="18" fill="url(#bg)"/>

  <g opacity="0.08">
    <path d="M0 20H700M0 40H700M0 60H700M0 80H700M0 100H700M0 120H700M0 140H700M0 160H700M0 180H700M0 200H700" stroke="#32FF9C"/>
    <path d="M20 0V220M60 0V220M100 0V220M140 0V220M180 0V220M220 0V220M260 0V220M300 0V220M340 0V220M380 0V220M420 0V220M460 0V220M500 0V220M540 0V220M580 0V220M620 0V220M660 0V220" stroke="#32FF9C"/>
  </g>

  <text x="25" y="28" fill="#32FF9C" font-family="Arial" font-size="16" font-weight="bold">
    TACTICAL RADAR
  </text>

  <g transform="translate(520 110)">
    <circle r="72" fill="none" stroke="#32FF9C" stroke-opacity="0.18"/>
    <circle r="54" fill="none" stroke="#32FF9C" stroke-opacity="0.22"/>
    <circle r="36" fill="none" stroke="#32FF9C" stroke-opacity="0.28"/>
    <circle r="18" fill="none" stroke="#32FF9C" stroke-opacity="0.35"/>

    <line x1="-72" y1="0" x2="72" y2="0" stroke="#32FF9C" opacity="0.18"/>
    <line x1="0" y1="-72" x2="0" y2="72" stroke="#32FF9C" opacity="0.18"/>

    <g filter="url(#glow)">
      <path d="M0,0 L0,-72 A72,72 0 0,1 24,-68 Z" fill="#32FF9C" opacity="0.28">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>

    <circle cx="-28" cy="22" r="3" fill="#9CFFD8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="34" cy="-16" r="3" fill="#9CFFD8">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="10" cy="42" r="2.5" fill="#9CFFD8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#C9FDD7" font-family="Arial" font-size="12">
    <text x="25" y="55">SYSTEM</text>
    <text x="25" y="75" fill="#32FF9C">UAV RECON ACTIVE</text>

    <text x="25" y="105">SCAN RATE</text>
    <text x="25" y="125" fill="#32FF9C">12.4 Hz</text>

    <text x="25" y="155">OBJECTS TRACKED</text>
    <text x="25" y="175" fill="#32FF9C">03 LOCKED</text>
  </g>
</svg>