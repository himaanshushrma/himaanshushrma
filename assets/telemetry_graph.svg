<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03110B"/>
      <stop offset="100%" stop-color="#06281B"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0AFF9D"/>
      <stop offset="100%" stop-color="#6CFFCC"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="220" rx="18" fill="url(#bg)" stroke="#14FF96" stroke-opacity="0.35"/>

  <g opacity="0.08" stroke="#29FFAA">
    <g>
      <line x1="0" y1="30" x2="800" y2="30"/>
      <line x1="0" y1="60" x2="800" y2="60"/>
      <line x1="0" y1="90" x2="800" y2="90"/>
      <line x1="0" y1="120" x2="800" y2="120"/>
      <line x1="0" y1="150" x2="800" y2="150"/>
      <line x1="0" y1="180" x2="800" y2="180"/>
    </g>
    <g>
      <line x1="80" y1="0" x2="80" y2="220"/>
      <line x1="160" y1="0" x2="160" y2="220"/>
      <line x1="240" y1="0" x2="240" y2="220"/>
      <line x1="320" y1="0" x2="320" y2="220"/>
      <line x1="400" y1="0" x2="400" y2="220"/>
      <line x1="480" y1="0" x2="480" y2="220"/>
      <line x1="560" y1="0" x2="560" y2="220"/>
      <line x1="640" y1="0" x2="640" y2="220"/>
      <line x1="720" y1="0" x2="720" y2="220"/>
    </g>
  </g>

  <text x="24" y="26" fill="#3DFFA8" font-family="Arial" font-size="13" font-weight="700">
    LIVE TELEMETRY
  </text>

  <g font-family="Arial" font-size="11" fill="#9CFDD0">
    <text x="22" y="48">ALT</text>
    <text x="22" y="66">1240 m</text>

    <text x="22" y="98">SPD</text>
    <text x="22" y="116">42 km/h</text>

    <text x="22" y="148">GPS</text>
    <text x="22" y="166">LOCK</text>

    <text x="22" y="198">FPS</text>
    <text x="22" y="214">62</text>
  </g>

  <g transform="translate(95,18)">
    <path d="M0 140
             L40 132
             L80 118
             L120 126
             L160 92
             L200 108
             L240 78
             L280 95
             L320 62
             L360 86
             L400 48
             L440 72
             L500 34"
          fill="none"
          stroke="url(#line)"
          stroke-width="3"
          filter="url(#glow)"
          stroke-linecap="round"
          stroke-dasharray="900"
          stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset"
               values="900;0"
               dur="3s"
               repeatCount="indefinite"/>
    </path>

    <circle r="5" fill="#4CFFBE" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M0 140 L40 132 L80 118 L120 126 L160 92 L200 108 L240 78 L280 95 L320 62 L360 86 L400 48 L440 72 L500 34"/>
    </circle>
  </g>

  <g transform="translate(640,28)">
    <text x="0" y="0" fill="#9CFDD0" font-family="Arial" font-size="10">BATTERY</text>

    <rect x="0" y="10" width="120" height="14" rx="7"
          fill="#07261A" stroke="#22FF9D" stroke-opacity=".35"/>

    <rect x="2" y="12" width="100" height="10" rx="5"
          fill="#29FFAA" filter="url(#glow)">
      <animate attributeName="width"
               values="100;88;104;96;100"
               dur="4s"
               repeatCount="indefinite"/>
    </rect>

    <text x="0" y="42" fill="#9CFDD0" font-family="Arial" font-size="10">SIGNAL</text>

    <g transform="translate(0,50)" fill="#25FF9F">
      <rect x="0" y="26" width="10" height="10">
        <animate attributeName="height" values="10;14;10" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;22;26" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="18" width="10" height="18">
        <animate attributeName="height" values="18;24;18" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;12;18" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="10" width="10" height="26">
        <animate attributeName="height" values="26;32;26" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;4;10" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="2" width="10" height="34">
        <animate attributeName="height" values="34;40;34" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-4;2" dur="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="0" y="118" fill="#9CFDD0" font-family="Arial" font-size="10">STATUS</text>

    <circle cx="12" cy="132" r="5" fill="#34FFAA" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite"/>
    </circle>

    <text x="24" y="136" fill="#34FFAA" font-family="Arial" font-size="11" font-weight="700">
      ONLINE
    </text>
  </g>

  <text x="420" y="204" fill="#1FFF92" font-family="Arial" font-size="11" opacity=".9">
    AI UAV TELEMETRY STREAM • REFRESH 60Hz
  </text>
</svg>