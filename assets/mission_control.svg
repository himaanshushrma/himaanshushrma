<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03100A"/>
    <stop offset="100%" stop-color="#07261A"/>
  </linearGradient>

  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="800" height="260" rx="18" fill="url(#bg)" stroke="#18FF9C" stroke-opacity=".35"/>

<text x="22" y="24" fill="#35FFAA" font-family="Arial" font-size="14" font-weight="700">
MISSION CONTROL CONSOLE
</text>

<g font-family="Arial" font-size="11" fill="#A5FFD8">

  <text x="28" y="48">SYSTEM</text>

  <circle cx="92" cy="44" r="5" fill="#32FF9C" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <text x="28" y="70">UAV LINK</text>

  <circle cx="92" cy="66" r="5" fill="#32FF9C" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <text x="28" y="92">GPS LOCK</text>

  <circle cx="92" cy="88" r="5" fill="#32FF9C" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <text x="28" y="114">AI CORE</text>

  <circle cx="92" cy="110" r="5" fill="#32FF9C" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

</g>

<g transform="translate(180 34)">
  <text x="0" y="-8" fill="#35FFAA" font-family="Arial" font-size="11">CPU ACTIVITY</text>

  <g fill="#29FFAA">
    <rect x="0" y="90" width="12" height="18">
      <animate attributeName="height" values="18;54;30;18" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;54;78;90" dur="1s" repeatCount="indefinite"/>
    </rect>

    <rect x="22" y="90" width="12" height="30">
      <animate attributeName="height" values="30;18;60;30" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="78;90;48;78" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect x="44" y="90" width="12" height="44">
      <animate attributeName="height" values="44;64;24;44" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="64;44;84;64" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <rect x="66" y="90" width="12" height="26">
      <animate attributeName="height" values="26;56;40;26" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="82;52;68;82" dur="1.3s" repeatCount="indefinite"/>
    </rect>

    <rect x="88" y="90" width="12" height="52">
      <animate attributeName="height" values="52;30;68;52" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="56;78;40;56" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<g transform="translate(420 36)">
  <text x="0" y="-8" fill="#35FFAA" font-family="Arial" font-size="11">UPLINK</text>

  <circle cx="72" cy="56" r="42" fill="none" stroke="#18FF9C" opacity=".25"/>
  <circle cx="72" cy="56" r="28" fill="none" stroke="#18FF9C" opacity=".4"/>
  <circle cx="72" cy="56" r="14" fill="#19FF9C" filter="url(#glow)"/>

  <circle cx="72" cy="56" r="42" stroke="#32FF9C" fill="none" stroke-width="2" opacity=".6">
    <animate attributeName="r" values="18;42;18" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0;.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="52" y="110" fill="#9CFDD0" font-family="Arial" font-size="10">ONLINE</text>
</g>

<g transform="translate(650 34)" font-family="Arial">
  <text x="0" y="-8" fill="#35FFAA" font-size="11">BATTERY</text>

  <rect x="0" y="0" width="92" height="16" rx="8" fill="#06271A" stroke="#22FF9D" stroke-opacity=".4"/>

  <rect x="2" y="2" width="74" height="12" rx="6" fill="#2AFFAA" filter="url(#glow)">
    <animate attributeName="width" values="74;68;78;72;74" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="0" y="38" fill="#9CFDD0" font-size="10">TEMP</text>
  <text x="50" y="38" fill="#32FF9C" font-size="10">47°C</text>

  <text x="0" y="60" fill="#9CFDD0" font-size="10">PING</text>
  <text x="50" y="60" fill="#32FF9C" font-size="10">12ms</text>

  <text x="0" y="82" fill="#9CFDD0" font-size="10">FPS</text>
  <text x="50" y="82" fill="#32FF9C" font-size="10">62</text>
</g>

<g transform="translate(18 178)" font-family="Courier New" font-size="10" fill="#55FFBB" opacity=".9">
  <text x="0" y="0">[AI] YOLO11 ENGINE ............. READY</text>
  <text x="0" y="18">[ROS2] NAVIGATION CORE ......... ACTIVE</text>
  <text x="0" y="36">[CV] MULTI OBJECT TRACKING ..... ONLINE</text>
  <text x="0" y="54">[SYS] ORBITAL RECON COMMAND .... OPERATIONAL</text>
</g>

</svg>